<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduManage | Academic Records</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #173b7a;
            padding: 25px 15px;
        }

        .logo {
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .logo span {
            color: #8ec5ff;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin: 8px 0;
        }

        .menu a {
            display: block;
            padding: 13px 15px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .menu a:hover,
        .menu .active {
            background: #2f6fca;
        }

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topbar h1 {
            font-size: 28px;
            color: #173b7a;
        }

        .admin {
            background: white;
            padding: 10px 18px;
            border-radius: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            font-weight: bold;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #173b7a;
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #2f6fca;
        }

        .add-btn {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #173b7a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #2f6fca;
        }

        .table-box {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #eef5ff;
            color: #173b7a;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            Edu<span>Manage</span>
        </div>

        <ul class="menu">

            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <a href="student.html">Students</a>
            </li>

            <li>
                <a href="teacher.html">Teachers</a>
            </li>

            <li>
                <a href="attendance.html">Attendance</a>
            </li>

            <li>
                <a href="examination.html">Examination</a>
            </li>

            <li>
                <a href="fees.html">Fees</a>
            </li>

            <li>
                <a href="academic_records.html" class="active">
                    Academic Records
                </a>
            </li>

        </ul>

    </div>


    <div class="main">

        <div class="topbar">

            <h1>Academic Records</h1>

            <div class="admin">
                👤 Admin
            </div>

        </div>


        <div class="form-box">

            <h2>Add Academic Record</h2>

            <div class="form-grid">

                <input
                    type="text"
                    id="studentId"
                    placeholder="Student ID">

                <input
                    type="text"
                    id="semester"
                    placeholder="Semester">

                <input
                    type="number"
                    step="0.01"
                    id="percentage"
                    placeholder="Percentage">

                <input
                    type="text"
                    id="grade"
                    placeholder="Grade">

            </div>


            <button
                class="add-btn"
                onclick="addRecord()">

                + Add Record

            </button>

        </div>


        <div class="table-box">

            <h2>Academic Records List</h2>

            <table>

                <thead>

                    <tr>
                        <th>Student ID</th>
                        <th>Semester</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                    </tr>

                </thead>

                <tbody id="academicTable">

                </tbody>

            </table>

        </div>

    </div>


    <script>

        async function addRecord() {

    let studentId =
        document.getElementById("studentId").value;

    let semester =
        document.getElementById("semester").value;

    let percentage =
        document.getElementById("percentage").value;

    let grade =
        document.getElementById("grade").value;


    if (
        studentId === "" ||
        semester === "" ||
        percentage === "" ||
        grade === ""
    ) {

        alert("Please fill all academic details.");

        return;
    }


    try {

        let response = await fetch(
            "http://localhost:8080/academic",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    student_id: studentId,
                    semester: semester,
                    percentage: percentage,
                    grade: grade

                })
            }
        );


        let result = await response.text();


        if (response.ok) {

            let table =
                document.getElementById("academicTable");

            let row =
                table.insertRow();


            row.insertCell(0).innerText =
                studentId;

            row.insertCell(1).innerText =
                semester;

            row.insertCell(2).innerText =
                percentage;

            row.insertCell(3).innerText =
                grade;


            alert(result);


            document.getElementById("studentId").value = "";

            document.getElementById("semester").value = "";

            document.getElementById("percentage").value = "";

            document.getElementById("grade").value = "";

        } else {

            alert(result);

        }


    } catch (error) {

        console.log(error);

        alert("Java server connection failed!");

    }

}

</script>
</body>
</html>
